name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành (ví dụ 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  release:
    name: Build · Sign · Publish APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore release keystore
        if: ${{ secrets.VCAM_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.VCAM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/vcam-release.jks"
          echo "VCAM_KEYSTORE_PATH=$RUNNER_TEMP/vcam-release.jks" >> "$GITHUB_ENV"

      - name: Export signing environment
        if: ${{ secrets.VCAM_KEYSTORE_BASE64 != '' }}
        run: |
          echo "VCAM_KEYSTORE_PASSWORD=${{ secrets.VCAM_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "VCAM_KEY_ALIAS=${{ secrets.VCAM_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "VCAM_KEY_PASSWORD=${{ secrets.VCAM_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Collect APK and compute SHA-256
        id: collect
        run: |
          set -e
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then echo "Không tìm thấy APK release"; exit 1; fi
          mkdir -p ../dist
          cp "$APK" ../dist/vcam-pro-ultimate.apk
          SIZE=$(stat -c%s ../dist/vcam-pro-ultimate.apk)
          SHA=$(sha256sum ../dist/vcam-pro-ultimate.apk | awk '{print $1}')
          echo "$SHA  vcam-pro-ultimate.apk" > ../dist/vcam-pro-ultimate.apk.sha256
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "APK size: $SIZE bytes"
          echo "SHA-256: $SHA"

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs ../dist/vcam-pro-ultimate.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: VCAM PRO ULTIMATE VIP 2026
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## VCAM PRO ULTIMATE VIP 2026

            Ứng dụng Android native, xử lý 100% trên thiết bị.

            - **Không** VPS · **Không** backend · **Không** cloud AI
            - Ứng dụng không khai báo quyền INTERNET
            - Dung lượng APK: ${{ steps.collect.outputs.size }} bytes
            - SHA-256: `${{ steps.collect.outputs.sha }}`
          files: |
            dist/vcam-pro-ultimate.apk
            dist/vcam-pro-ultimate.apk.sha256

      - name: Update website release metadata
        run: |
          set -e
          REPO="${{ github.repository }}"
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          SHA="${{ steps.collect.outputs.sha }}"
          SIZE="${{ steps.collect.outputs.size }}"
          RELEASE_DATE=$(date -u +%Y-%m-%d)
          mkdir -p ../website/data
          cat > ../website/data/release.json <<EOF
          {
            "appName": "VCAM PRO ULTIMATE VIP 2026",
            "version": "${VERSION}",
            "buildNumber": "${{ github.run_number }}",
            "releaseDate": "${RELEASE_DATE}",
            "apkSizeBytes": ${SIZE},
            "minAndroid": "Android 8.0 (API 26)",
            "architectures": ["arm64-v8a", "armeabi-v7a", "x86_64"],
            "sha256": "${SHA}",
            "downloadUrl": "https://github.com/${REPO}/releases/latest/download/vcam-pro-ultimate.apk",
            "sha256Url": "https://github.com/${REPO}/releases/latest/download/vcam-pro-ultimate.apk.sha256",
            "releaseNotesUrl": "https://github.com/${REPO}/releases/latest",
            "repository": "${REPO}",
            "status": "stable"
          }
          EOF
          cat ../website/data/release.json

      - name: Commit release metadata
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/release.json
          git commit -m "chore: cập nhật metadata phát hành $(date -u +%Y-%m-%d)" || echo "Không có thay đổi"
          git push || echo "Không push được metadata (bỏ qua)"
